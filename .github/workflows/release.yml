name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release version
        run: node -e "const m=require('./manifest.json'); if (m.version !== process.env.GITHUB_REF_NAME) { console.error('Tag and manifest version do not match'); process.exit(1) }"

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        run: |
          npm test
          npm run check:types
          npm run build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" manifest.json main.js styles.css --generate-notes --verify-tag
